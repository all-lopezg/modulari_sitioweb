# Workflow TEMPORAL de diagnóstico: verifica si los secrets de Google Ads
# llegan al runner de CI. No imprime valores, solo presencia y longitud.
# Se eliminará una vez resuelto el problema.
name: Diagnosticar secrets de Google Ads

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GADS_ID: ${{ secrets.NEXT_PUBLIC_GADS_ID }}
      GADS_LABEL: ${{ secrets.NEXT_PUBLIC_GADS_CONVERSION_LABEL }}
      GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
    steps:
      - name: Verificar presencia de secrets
        run: |
          for v in GADS_ID GADS_LABEL GA_ID; do
            val="${!v}"
            if [ -z "$val" ]; then
              echo "$v: VACIO (no llego al workflow)"
            else
              echo "$v: OK (longitud ${#val})"
            fi
          done
