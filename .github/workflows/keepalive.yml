# Keep-alive del proyecto InsForge (plan Free). Un proyecto Free se pausa
# tras 7 días sin actividad real: los health checks (/health, /api/health)
# NO reinician el contador (verificado 2026-10-17: la plataforma sondea
# /stats cada hora y aun así pausa), mientras que la actividad autenticada
# sí lo reinicia. Por eso este workflow hace a diario una consulta
# autenticada al proyecto. Si falla, GitHub notifica por correo.
name: Keep-alive InsForge

on:
  schedule:
    # 12:17 UTC = 09:17 en Chile (horario de verano, UTC-3)
    - cron: '17 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      INSFORGE_PROJECT_ID: 0a17cd33-48bd-48db-be5b-d40345d5d190
    steps:
      - name: Consulta autenticada a Modulari_sitioweb
        env:
          INSFORGE_USER_API_KEY: ${{ secrets.INSFORGE_USER_API_KEY }}
        run: |
          npx -y @insforge/cli login --user-api-key "$INSFORGE_USER_API_KEY" --json > /dev/null
          npx -y @insforge/cli link --project-id "$INSFORGE_PROJECT_ID" -y
          npx -y @insforge/cli db query "SELECT 1 AS keepalive" --json
